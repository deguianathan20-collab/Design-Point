<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#0B0F19;overflow:hidden">
<div id="wrap"><iframe id="f" src="index.html" style="border:0;display:block"></iframe></div>
<script>
var p = location.hash.slice(1).split(',');
var w = parseInt(p[0],10)||390, off = parseInt(p[1],10)||0, h = parseInt(p[2],10)||3000;
document.getElementById('f').style.width = w+'px';
document.getElementById('f').style.height = (off+h)+'px';
document.getElementById('wrap').style.marginTop = (-off)+'px';
</script>
